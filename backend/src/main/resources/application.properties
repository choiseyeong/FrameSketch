spring.application.name=framesketch

server.port=8080

# SQLite: single local file. Override the location with FRAMESKETCH_DB_PATH.
spring.datasource.url=jdbc:sqlite:${FRAMESKETCH_DB_PATH:./data/framesketch.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# schema.sql runs on every startup; every statement is CREATE ... IF NOT EXISTS.
# The encoding must be stated explicitly: it otherwise defaults to the platform
# charset, which mangles the Korean comments in schema.sql on Windows.
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# CORS origin for the Vite dev server.
framesketch.cors.allowed-origins=http://localhost:5173

# Load backend/.env when present, so the API key can live in a gitignored file
# instead of an OS environment variable. "optional:" means startup still works
# when the file is missing; an OS environment variable takes priority over it.
spring.config.import=optional:file:./.env[.properties]

# Gemini API. Never write the key here - put it in .env or an environment
# variable. When it is absent the LLM features are disabled but the app starts.
framesketch.gemini.api-key=${GEMINI_API_KEY:}
# gemini-flash-latest is Google's maintained alias for the current recommended
# Flash model. Using the alias means we do not have to track exact version
# numbers as Google deprecates them (gemini-2.5-flash was unreachable for
# newly-issued keys at the time of writing).
framesketch.gemini.model=gemini-flash-latest
